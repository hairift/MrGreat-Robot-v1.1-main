# Menjalankan server Mr Great beserta Redis di komputer sendiri.
#
#   cd server
#   docker compose up -d --build
#
# Setelah menyala, isi CONFIG_MRGREAT_SERVER_URL di firmware dengan
# http://<ip-komputer>:8000
services:
  redis:
    image: redis:7-alpine
    container_name: mrgreat-redis
    restart: unless-stopped
    # Singgahan boleh hilang saat mati, jadi tidak perlu penyimpanan permanen.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mrgreat-server:
    build: .
    container_name: mrgreat-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Harus sama dengan CONFIG_MRGREAT_SERVER_SECRET di firmware.
      MRGREAT_SECRET_KEY: "mrgreat-robot-2026"
      # Kunci YouTube Data API v3 untuk mencari lagu.
      YOUTUBE_API_KEY: "${YOUTUBE_API_KEY:-}"
      YOUTUBE_REGION: "ID"
      REDIS_URL: "redis://redis:6379/0"
      CACHE_TTL_SEARCH: "600"
      REQUIRE_AUTH: "true"
    volumes:
      # Dokumen sumber RAG dan singgahan lagu disimpan di luar kontainer supaya
      # tidak hilang saat citra dibangun ulang.
      - ./data:/app/data
      - mrgreat-music:/app/music_cache
      - mrgreat-vector:/app/vectorstore
    depends_on:
      redis:
        condition: service_healthy

volumes:
  mrgreat-music:
  mrgreat-vector:
